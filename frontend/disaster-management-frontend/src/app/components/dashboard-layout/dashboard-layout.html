<div class="min-h-screen bg-gray-50 flex">
  <!-- Sidebar -->
  <div class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 transform transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0"
       [class.translate-x-0]="sidebarOpen"
       [class.-translate-x-full]="!sidebarOpen">
    
    <!-- Sidebar Header -->
    <div class="flex items-center justify-between h-16 px-4 border-b border-slate-700">
      <div class="flex items-center">
        <h1 class="text-xl font-bold text-white">DisasterHub</h1>
      </div>
      <button (click)="toggleSidebar()" class="lg:hidden text-gray-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="mt-8 px-4">
      <div class="space-y-2">
        <!-- Dashboard -->
        <a routerLink="/dashboard" class="flex items-center px-4 py-2 text-sm font-medium rounded-lg text-white bg-blue-600">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          Dashboard
        </a>

        <!-- Admin Navigation -->
        <ng-container *ngIf="isAdmin">
          <a routerLink="admin" class="flex items-center px-4 py-2 text-sm font-medium rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            Disaster Management
          </a>
          <a routerLink="admin" class="flex items-center px-4 py-2 text-sm font-medium rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            Rescue Tasks
          </a>
          <a routerLink="admin" class="flex items-center px-4 py-2 text-sm font-medium rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            User Management
          </a>
        </ng-container>

        <!-- Responder Navigation -->
        <ng-container *ngIf="isResponder">
          <a routerLink="responder" class="flex items-center px-4 py-2 text-sm font-medium rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
            My Tasks
          </a>
        </ng-container>

        <!-- Citizen Navigation -->
        <ng-container *ngIf="isCitizen">
          <a routerLink="citizen" class="flex items-center px-4 py-2 text-sm font-medium rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            Regional Alerts
          </a>
          <a routerLink="citizen" class="flex items-center px-4 py-2 text-sm font-medium rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
            Report Disaster
          </a>
        </ng-container>
      </div>
    </nav>

    <!-- User Info -->
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-slate-700">
      <div class="flex items-center">
        <div class="flex-shrink-0">
          <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
            <span class="text-white text-sm font-medium">{{ currentUser?.name?.charAt(0) || 'U' }}</span>
          </div>
        </div>
        <div class="ml-3">
          <p class="text-sm font-medium text-white">{{ currentUser?.name || 'User' }}</p>
          <p class="text-xs text-gray-400">{{ userRole }}</p>
        </div>
      </div>
      <button (click)="logout()" class="mt-3 w-full flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-red-600 hover:bg-red-700">
        Logout
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 lg:ml-0">
    <!-- Top Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
      <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16">
        <button (click)="toggleSidebar()" class="lg:hidden text-gray-400 hover:text-gray-500">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        
        <div class="flex items-center space-x-4">
          <h2 class="text-lg font-semibold text-gray-900">Dashboard</h2>
        </div>

        <div class="flex items-center space-x-4">
          <span class="text-sm text-gray-500">{{ currentDate | date:'medium' }}</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile sidebar overlay -->
  <div *ngIf="sidebarOpen" 
       class="fixed inset-0 z-40 bg-gray-600 bg-opacity-75 lg:hidden"
       (click)="toggleSidebar()">
  </div>
</div>
