<div class="min-h-screen bg-gradient-to-br from-blue-900 via-indigo-900 to-purple-900 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="absolute inset-0 bg-black opacity-50"></div>
  <div class="relative max-w-md w-full space-y-8">
    <div class="bg-gradient-to-br from-white/95 to-blue-50/95 backdrop-blur-xl rounded-2xl shadow-2xl p-8 border border-white/20">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mb-2">Welcome Back</h2>
        <p class="text-gray-700">Sign in to DisasterHub emergency management system</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Email Field -->
        <div class="space-y-2">
          <label for="email" class="block text-sm font-semibold text-gray-800">Email Address</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="Enter your email"
            [class.border-red-500]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            class="w-full px-4 py-3 bg-white/80 backdrop-blur border border-gray-300/50 placeholder-gray-500 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition-all duration-200"
          >
          <div class="text-red-500 text-xs mt-1" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <label for="password" class="block text-sm font-semibold text-gray-800">Password</label>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="Enter your password"
            [class.border-red-500]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            class="w-full px-4 py-3 bg-white/80 backdrop-blur border border-gray-300/50 placeholder-gray-500 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition-all duration-200"
          >
          <div class="text-red-500 text-xs mt-1" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Password is required
          </div>
        </div>

        <!-- Error Message -->
        <div class="rounded-xl p-4 bg-red-100/80 backdrop-blur border border-red-300" *ngIf="errorMessage">
          <p class="text-red-700 text-sm font-medium">{{ errorMessage }}</p>
        </div>

        <!-- Submit Button -->
        <div>
          <button 
            type="submit" 
            [disabled]="loginForm.invalid || isLoading" 
            class="group relative w-full flex justify-center py-4 px-6 border border-transparent text-base font-bold rounded-xl text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform hover:scale-[1.02] shadow-lg"
          >
            <span *ngIf="!isLoading" class="flex items-center">
              <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14M3 12v8a2 2 0 002 2h14a2 2 0 002-2v-8"/>
              </svg>
              Sign In
            </span>
            <span *ngIf="isLoading" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Signing in...
            </span>
          </button>
        </div>
      </form>

      <!-- Signup Link -->
      <div class="text-center pt-6 border-t border-gray-200/50">
        <p class="text-sm text-gray-700">
          Don't have an account? 
          <a routerLink="/signup" class="font-bold text-blue-600 hover:text-purple-600 transition-colors duration-200">
            Create account here
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
